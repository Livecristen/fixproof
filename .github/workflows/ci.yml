name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: git identity for temp repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: stdlib-only check
        run: python -m unittest tests.test_meta.Meta.test_stdlib_only -v
      - name: banned-claims grep
        shell: bash
        run: |
          if grep -nwiE 'first|only|unforgeable' ./*.md 2>/dev/null; then echo "banned wording found"; exit 1; fi
      - name: scenario and security tests
        run: python -m unittest discover -s tests -v
      - name: examples end-to-end (must be VERIFIED)
        shell: bash
        run: |
          set -e
          python examples/run_example.py python
          python examples/run_example.py js-ts
          python examples/run_example.py ts
  gitleaks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum-verified)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --verbose .
