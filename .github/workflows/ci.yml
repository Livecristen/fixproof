name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: git identity for temp repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: stdlib-only check
        run: python -m unittest tests.test_meta.Meta.test_stdlib_only -v
      - name: banned-claims grep
        shell: bash
        run: |
          if grep -nwiE 'first|only|unforgeable' ./*.md examples/*.md 2>/dev/null; then echo "banned wording found"; exit 1; fi
      - name: scenario tests
        run: python -m unittest discover -s tests -v
      - name: examples end-to-end (must be VERIFIED)
        shell: bash
        run: |
          set -e
          python examples/run_example.py python
          python examples/run_example.py js-ts
          python examples/run_example.py ts
